<!-- WistCenter（控制中心）：三格蜂巢 —— 三个**共边**的六边形（尖顶朝上），
     一个中心管住一片网关。与网关 WarpGateway 的「单格立方体」刻意区分：格数与配色都不同
     （中心 = 紫罗兰→紫的蜂巢；网关 = 紫罗兰→青的单格）。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" role="img" aria-label="WistCenter">
  <defs>
    <linearGradient id="center-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <rect width="20" height="20" rx="5" fill="url(#center-badge)" />
  <!-- 三格蜂巢：上中一格 + 左下 / 右下各一格（circumradius 4.35，相邻边完全重合） -->
  <g fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linejoin="round">
    <path d="M10 2.39 13.77 4.565v4.35L10 11.09 6.23 8.915v-4.35Z" />
    <path d="M6.23 8.915 10 11.09v4.35L6.23 17.615 2.46 15.44v-4.35Z" />
    <path d="M13.77 8.915 17.54 11.09v4.35L13.77 17.615 10 15.44v-4.35Z" />
  </g>
</svg>
