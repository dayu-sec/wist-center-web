name: Build & Test

on:
  push:
    branches:
      - "*"
  pull_request:
    types: [opened, reopened]
    branches:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Contract tests (agent package push)
        run: npm run test:agent-package-push

      # 知识库包下发：动作字面量、spec（targets + activate）、创建/读回、写操作不回落示例。
      - name: Contract tests (knowledge package push)
        run: npm run test:knowledge-package-push

      # 发布页的组件契约：① 含 gwlinkd、② 只发 agentd、① 组件都能在包管理里选到版本。
      - name: Test (release components)
        run: npm run test:release-components

      # 安装包来源：录入页「按版本号检查」拼 URL 的配置（字段名 / 归一化 / 空配置）。
      - name: Test (package sources contract)
        run: npm run test:package-sources

      # 发布执行页的逐台反馈：消息 / 日志路径拆分（长路径不再撑行）。
      - name: Test (execution detail contract)
        run: npm run test:execution-detail

      # 网关详情页手动升级：单目标 / 单阶段 / 版本去 v 前缀 / spec 与发布页同源。
      - name: Test (manual gateway upgrade)
        run: npm run test:manual-upgrade

      # 管理 token 的传输机制（存哪 / Bearer 注入 / 401 自动清 / 429 保留 + Retry-After）。
      - name: Test (admin token mechanism)
        run: npm run test:admin-token

# 说明：本文件原先逐字节复制自 wist-gateway-web 的 ci.yml，已按本项目的实际能力收敛。
# 本仓已加 tests/ 与 `test:agent-package-push`（发布 ② 契约），故恢复了对应步骤。
# 仍**未**恢复的两条（属 gateway 侧 / 本仓尚不具备）：
#   - `npm run test:bundle`             （网关侧的 admin token 打包泄漏检查）
#   - `npm run test:gateway-initialize` （网关初始化契约，属 gateway 侧，与本项目无关）
# 若要补「打包产物不得泄漏 Admin Token」这类能力，需先在本仓加对应 script 再恢复步骤。

      # 浅色 / 深色两套 token 的对齐 + 对比度（AA）+ 主题状态机。
      - name: Test (theme contract)
        run: npm run test:theme
