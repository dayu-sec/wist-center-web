name: Build & Test

on:
  push:
    branches:
      - "*"
  pull_request:
    types: [opened, reopened]
    branches:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Contract tests
        run: npm run test:agent-package-push

# 说明：本文件原先逐字节复制自 wist-gateway-web 的 ci.yml，已按本项目的实际能力收敛。
# 本仓已加 tests/ 与 `test:agent-package-push`（发布 ② 契约），故恢复了对应步骤。
# 仍**未**恢复的两条（属 gateway 侧 / 本仓尚不具备）：
#   - `npm run test:bundle`             （网关侧的 admin token 打包泄漏检查）
#   - `npm run test:gateway-initialize` （网关初始化契约，属 gateway 侧，与本项目无关）
# 若要补「打包产物不得泄漏 Admin Token」这类能力，需先在本仓加对应 script 再恢复步骤。
